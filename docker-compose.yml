services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: plataforma_enem
    # Host port 5433 (not the default 5432): avoids colliding with a native
    # Postgres install/service some dev machines already run on 5432. If
    # 5433 is also taken on your machine, change this and DATABASE_URL in
    # .env.local together — the container's internal port stays 5432.
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
